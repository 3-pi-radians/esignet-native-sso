org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# --- Native SSO demo configuration (override in ~/.gradle/gradle.properties or with -P) ---
# eSignet issuer as seen from the device. With `adb reverse tcp:8088 tcp:8088` the emulator reaches
# the host's eSignet at localhost, so the issuer matches what the server advertises.
nsso.issuer=http://localhost:8088
nsso.superClientId=nsso-demo-super-app
nsso.childClientId=nsso-demo-child-app
nsso.superRedirectUri=io.mosip.nativesso.superapp://callback
nsso.childRedirectUri=io.mosip.nativesso.childapp://callback
